server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames make long-lived caching safe. A single directive keeps
    # nginx from emitting two Cache-Control headers (expires would add its own).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached or users keep an old bundle after a rollout.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: unknown paths fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
