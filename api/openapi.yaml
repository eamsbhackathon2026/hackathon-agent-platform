  /v1/agents/{agentId}/runs:
    post:
      operationId: CreateRun
      tags:
      - runs
      summary: Gọi trợ lý
      description: 'Sync chờ hoàn tất và trả Run (kể cả failed/cancelled). Async trả 202 và tiếp tục khi client
        ngắt. API key cần runs:write. Sync ngắt kết nối thì hủy. Async thực thi at-most-once: mất lease sau khi
        bắt đầu thì failed/interrupted; không chạy lại công cụ. Mỗi hội thoại chỉ có một lần xử lý queued/running;
        yêu cầu tiếp theo trả 409 run_in_progress. Mỗi run thực thi tối đa 25 tool call; khi hết budget, engine
        yêu cầu AI trả lời từ kết quả đã có mà không gọi thêm tool. Quyền JWT tối thiểu: member.'
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        default:
          $ref: '#/components/responses/ProblemResponse'
        '202':
          description: Đã nhận; lần đầu status=queued. Replay trả cùng run_id với trạng thái hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
          headers:
            Location:
              schema:
                type: string
              description: Đường dẫn /v1/runs/{run_id} để đọc kết quả.
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
      x-required-role: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreateRequest'
      parameters:
      - $ref: '#/components/parameters/agentId'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-api-key-scopes:
      - runs:write
      callbacks:
        runResult:
          '{$request.body#/webhook_url}':
            post:
              summary: Gửi kết quả đã ký
              description: 'Chỉ khi có webhook_url và dùng API key. Standard Webhooks ký HMAC-SHA256 bằng phần base64
                đã giải mã sau whsec_: id.timestamp.body (body nguyên byte). ID ổn định qua retry; timestamp/signature
                làm mới mỗi lần. Receiver xác minh trước khi parse, kiểm timestamp lệch tối đa 5 phút, dedupe webhook-id.
                Retry non-2xx trừ 410, tối đa 8 lần, backoff min(10s × 2^(n−1), 1h) ±20%, timeout 10s; không follow
                redirect.'
              security: []
              parameters:
              - name: webhook-id
                in: header
                required: true
                schema:
                  type: string
                description: ID giao kết quả ổn định qua retry.
              - name: webhook-timestamp
                in: header
                required: true
                schema:
                  type: string
                description: Unix timestamp giây, dạng chuỗi số thập phân.
              - name: webhook-signature
                in: header
                required: true
                schema:
                  type: string
                description: v1,<base64 HMAC-SHA256(secret, id.timestamp.body)>
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/RunWebhookPayload'
              responses:
                '200':
                  description: Đã nhận; mọi 2xx đều thành công.
                '410':
                  description: Địa chỉ không còn sử dụng, dừng retry.
                default:
                  description: Lỗi nhận, thử lại theo lịch.
              operationId: DeliverRunWebhook
              tags:
              - webhooks
  /v1/agents/{agentId}/runs/stream:
    post:
      operationId: StreamRun
      tags:
      - runs
      summary: Gọi trợ lý và nhận nội dung trực tiếp
      description: 'API key cần runs:write. Trước khi mở stream, lỗi trả Problem. Sau HTTP 200, lỗi gửi run.failed
        (cancelled dùng code run_cancelled). Mỗi frame có event bằng type, id tăng dần, data là JSON RunEvent. Heartbeat
        comment : ping mỗi 15 giây; flush từng event. Không resume Last-Event-ID. Ngắt kết nối hủy lần xử lý; đọc
        GET /runs/{id} để biết trạng thái cuối. Mỗi hội thoại chỉ có một lần xử lý đang hoạt động; yêu cầu tiếp theo
        trả 409 run_in_progress. Mỗi run thực thi tối đa 25 tool call; khi hết budget, engine yêu cầu AI trả lời
        từ kết quả đã có mà không gọi thêm tool. Quyền JWT tối thiểu: member.'
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Luồng SSE cho đến sự kiện cuối run.completed hoặc run.failed.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-cache
              description: Không cache.
            X-Accel-Buffering:
              schema:
                type: string
                enum:
                - 'no'
              description: Tắt buffering của proxy.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/RunEvent'
        default:
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
      x-required-role: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunStreamRequest'
      parameters:
      - $ref: '#/components/parameters/agentId'
      x-api-key-scopes:
      - runs:write
