          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
      x-required-role: member
      parameters:
      - $ref: '#/components/parameters/agentId'
    patch:
      operationId: UpdateAgent
      tags:
      - agents
      summary: Cập nhật trợ lý
      description: 'Cập nhật trợ lý. Quyền JWT tối thiểu: admin.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        default:
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdateRequest'
      parameters:
      - $ref: '#/components/parameters/agentId'
    delete:
      operationId: DeleteAgent
      tags:
      - agents
      summary: Xóa trợ lý
      description: 'Lưu trữ trợ lý để giữ lịch sử. Quyền JWT tối thiểu: admin.'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Thành công.
        default:
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
