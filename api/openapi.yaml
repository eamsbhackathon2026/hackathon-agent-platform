      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: CreateProvider
      tags:
      - providers
      summary: Tạo kết nối AI
      description: 'Tạo kết nối AI. Quyền JWT tối thiểu: admin.'
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        default:
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCreateRequest'
  /v1/providers/{providerId}:
    get:
      operationId: GetProvider
      tags:
      - providers
      summary: Xem kết nối AI
      description: 'Xem kết nối AI. Quyền JWT tối thiểu: member.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
