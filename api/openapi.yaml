        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
      x-required-role: member
      parameters:
      - $ref: '#/components/parameters/providerId'
    patch:
      operationId: UpdateProvider
      tags:
      - providers
      summary: Cập nhật kết nối AI
      description: 'Cập nhật kết nối AI. Quyền JWT tối thiểu: admin.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
