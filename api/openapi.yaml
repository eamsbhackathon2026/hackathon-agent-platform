      tags:
      - agents
      summary: Liệt kê trợ lý
      description: 'Liệt kê trợ lý. Quyền JWT tối thiểu: member.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPage'
        default:
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
