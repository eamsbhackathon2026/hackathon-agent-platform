      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderUpdateRequest'
      parameters:
      - $ref: '#/components/parameters/providerId'
    delete:
      operationId: DeleteProvider
      tags:
      - providers
      summary: Xóa kết nối AI
      description: 'Trả 409 conflict kèm related_agents nếu còn trợ lý sử dụng. Quyền JWT tối thiểu: admin.'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Thành công.
        default:
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
      x-required-role: admin
      parameters:
      - $ref: '#/components/parameters/providerId'
  /v1/agents:
