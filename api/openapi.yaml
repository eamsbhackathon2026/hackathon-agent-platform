      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
          default: ''
        provider_id:
          type: string
          format: uuid
        model:
          type: string
          minLength: 1
          maxLength: 200
        system_prompt:
          type: string
          maxLength: 100000
          default: ''
        temperature:
          type: number
          minimum: 0
          maximum: 2
          nullable: true
        max_output_tokens:
          type: integer
