openapi: 3.0.3
info:
  title: Agent Platform API
  version: 0.1.0
  description: Contract nguồn cho MVP một không gian làm việc dùng chung. ID UUID v7 do server sinh; thời gian RFC3339
    UTC. Quyền truy cập theo vai trò và người tạo tài nguyên. Thiếu quyền trả 403; tài nguyên không được phép đọc
    có thể trả 404. JWT có role/status đọc lại từ DB mỗi request. Nếu must_change_password=true chỉ cho /me, đổi
    mật khẩu và đăng xuất cho tới khi đổi thành công. Các request chứa bí mật không được log. Trường bí mật đầu
    vào writeOnly; payload đọc không có plaintext; giá trị trả một lần có schema riêng. Không gửi JWT và X-API-Key
    đồng thời (400 validation_failed).
servers:
- url: http://localhost:8080
  description: Máy phát triển cục bộ
tags:
- name: system
  description: Trạng thái hệ thống
- name: auth
  description: Đăng nhập và tài khoản
- name: members
  description: Thành viên
- name: api-keys
  description: Khóa truy cập hệ thống
- name: providers
  description: Kết nối AI
- name: agents
  description: Trợ lý AI
- name: runs
  description: Gọi trợ lý và kết quả
- name: sessions
  description: Hội thoại
- name: tools
  description: Công cụ và máy chủ công cụ
- name: skills
  description: Thư viện hướng dẫn chuyên môn cho trợ lý
- name: webhooks
  description: Gửi kết quả tới hệ thống khác
- name: reports
  description: Báo cáo tổng quan
security:
- bearerAuth: []
paths:
  /healthz:
    get:
      operationId: GetHealth
      tags:
      - system
      summary: Kiểm tra tiến trình
      description: Kiểm tra tiến trình.
      security: []
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        default:
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
  /readyz:
    get:
      operationId: GetReady
      tags:
      - system
      summary: Kiểm tra khả năng phục vụ
      description: Kiểm tra khả năng phục vụ.
      security: []
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        default:
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
  /v1/auth/config:
    get:
      operationId: GetAuthConfig
      tags:
      - auth
      summary: Kiểm tra khả năng tạo tài khoản đầu tiên
      description: signup_allowed=true khi chưa có tài khoản. Sau khi thiết lập, owner/admin thêm thành viên.
      security: []
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /v1/auth/register:
    post:
      operationId: Register
      tags:
      - auth
      summary: Tạo tài khoản chủ sở hữu đầu tiên
      description: Chỉ cho phép khi chưa có tài khoản. Các thành viên tiếp theo do owner/admin thêm. Refresh token
        lưu cookie HttpOnly; SameSite=Strict; Path=/v1/auth; Secure ngoài dev. Access token hết hạn sau 15 phút;
        refresh token có hạn tuyệt đối 30 ngày.
      security: []
      responses:
        '201':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Cookie refresh_token mới, HttpOnly; SameSite=Strict; Path=/v1/auth; Secure ngoài dev.
        default:
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /v1/auth/login:
    post:
      operationId: Login
      tags:
      - auth
      summary: Đăng nhập
      description: Refresh token lưu cookie HttpOnly; SameSite=Strict; Path=/v1/auth; Secure ngoài dev. Access token
        hết hạn sau 15 phút. Giới hạn 10 lần/15 phút theo email và IP; lỗi không tiết lộ email tồn tại.
      security: []
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Cookie refresh_token mới, HttpOnly; SameSite=Strict; Path=/v1/auth; Secure ngoài dev.
        default:
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /v1/auth/refresh:
    post:
      operationId: Refresh
      tags:
      - auth
      summary: Khôi phục phiên đăng nhập
      description: Refresh token lưu cookie HttpOnly; SameSite=Strict; Path=/v1/auth; Secure ngoài dev. Access token
        hết hạn sau 15 phút. Refresh xoay token; tái sử dụng token cũ thu hồi cả family. Kiểm tra Origin theo allowlist.
      security:
      - refreshCookie: []
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Cookie refresh_token mới, HttpOnly; SameSite=Strict; Path=/v1/auth; Secure ngoài dev.
        default:
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
  /v1/auth/logout:
    post:
      operationId: Logout
      tags:
      - auth
      summary: Đăng xuất
      description: Thu hồi refresh token family và xóa cookie; thực hiện lặp lại an toàn kể cả khi cookie đã bị
        xóa.
      security:
      - refreshCookie: []
      - {}
      responses:
        '204':
          description: Thành công.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Xóa refresh_token với Max-Age=0 và cùng Path.
        default:
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
  /v1/me:
    get:
      operationId: GetMe
      tags:
      - auth
      summary: Xem tài khoản hiện tại
      description: 'Xem tài khoản hiện tại. Quyền JWT tối thiểu: member.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        default:
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
      x-required-role: member
  /v1/me/password:
    post:
      operationId: ChangePassword
      tags:
      - auth
      summary: Đổi mật khẩu
      description: 'Cho phép cả tài khoản phải đổi mật khẩu. Xóa must_change_password và thu hồi các refresh token
        khác. Quyền JWT tối thiểu: member.'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Thành công.
        default:
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
      x-required-role: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
  /v1/members:
    get:
      operationId: ListMembers
      tags:
      - members
      summary: Liệt kê thành viên
      description: 'Liệt kê thành viên. Quyền JWT tối thiểu: admin.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        default:
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
      x-required-role: admin
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: CreateMember
      tags:
      - members
      summary: Thêm thành viên
      description: 'Mật khẩu tạm do server sinh, trả một lần; thành viên mới phải đổi mật khẩu. Chỉ owner được gán
        admin/owner. Quyền JWT tối thiểu: admin.'
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberCreated'
        default:
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCreateRequest'
  /v1/members/{userId}:
    patch:
      operationId: UpdateMember
      tags:
      - members
      summary: Cập nhật thành viên
      description: 'Admin chỉ sửa member. Chỉ owner được đổi vai trò admin/owner. Không hạ vai trò hoặc vô hiệu
        hóa owner hoạt động cuối cùng. Quyền JWT tối thiểu: admin.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        default:
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdateRequest'
      parameters:
      - $ref: '#/components/parameters/userId'
  /v1/api-keys:
    get:
      operationId: ListApiKeys
      tags:
      - api-keys
      summary: Liệt kê khóa truy cập
      description: 'Liệt kê khóa truy cập. Quyền JWT tối thiểu: admin.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyPage'
        default:
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
      x-required-role: admin
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    post:
      operationId: CreateApiKey
      tags:
      - api-keys
      summary: Tạo khóa truy cập
      description: 'Key và webhook_secret chỉ xuất hiện trong phản hồi này; không thể đọc lại. Quyền JWT tối thiểu:
        admin.'
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        default:
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreateRequest'
  /v1/api-keys/{keyId}:
    delete:
      operationId: RevokeApiKey
      tags:
      - api-keys
      summary: Thu hồi khóa truy cập
      description: 'Thu hồi khóa truy cập. Quyền JWT tối thiểu: admin.'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Thành công.
        default:
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
      x-required-role: admin
      parameters:
      - $ref: '#/components/parameters/keyId'
  /v1/providers:
    get:
