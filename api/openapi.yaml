      - $ref: '#/components/parameters/runId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
  /v1/webhook-deliveries/{deliveryId}/retry:
    post:
      operationId: RetryWebhookDelivery
      tags:
      - webhooks
      summary: Gửi lại kết quả
      description: 'Đặt trạng thái pending, reset attempts và lên lịch ngay. Trả 409 conflict nếu đang gửi hoặc
        đã pending; kiểm tra lại quyền, URL và khóa trước khi gửi. Quyền JWT tối thiểu: admin.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        default:
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
      x-required-role: admin
      parameters:
      - $ref: '#/components/parameters/deliveryId'
  /v1/reports/overview:
    get:
      operationId: GetOverviewReport
      tags:
      - reports
      summary: Báo cáo tổng quan
      description: 'Tổng hợp khối lượng sử dụng và độ tin cậy của toàn không gian làm việc trong một khoảng thời
        gian. Khóa truy cập không gọi được endpoint này. Quyền JWT tối thiểu: admin.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewReport'
        default:
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
      x-required-role: admin
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date-time
        description: 'Đầu khoảng thời gian theo created_at, gồm đầu. Mặc định bằng to trừ 7 ngày.'
      - name: to
        in: query
        schema:
          type: string
          format: date-time
        description: 'Cuối khoảng thời gian theo created_at, không gồm cuối. Mặc định là thời điểm hiện tại; from
          phải nhỏ hơn to và khoảng không quá 90 ngày.'
      - name: time_zone
        in: query
        schema:
          type: string
        description: 'Tên múi giờ IANA quyết định ranh giới ngày khi gom nhóm, ví dụ Asia/Ho_Chi_Minh. Mặc định
          UTC.'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT cho người dùng; owner > admin > member. Quyền kiểm tra tại server.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Khóa truy cập không gian làm việc. runs:write để tạo/stream; runs:read để đọc/hủy run chính key
        tạo. Không truy cập cấu hình, session, span.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Opaque refresh token HttpOnly; Secure ngoài dev, SameSite=Strict, Path=/v1/auth.
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Số phần tử tối đa.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 2048
      description: Cursor mờ từ next_cursor của trang trước; giữ nguyên bộ lọc.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        minLength: 1
        maxLength: 255
      description: Khóa chống lặp, TTL 24 giờ; phạm vi principal. Hash method + path + body JSON chuẩn hóa. Cùng
        body trả cùng run; khác body trả 422. Sync đang chạy trả 409 run_in_progress kèm run_id.
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID tài nguyên trong không gian làm việc.
    keyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID tài nguyên trong không gian làm việc.
    providerId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID tài nguyên trong không gian làm việc.
    agentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID tài nguyên trong không gian làm việc.
    runId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID tài nguyên trong không gian làm việc.
    sessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID tài nguyên trong không gian làm việc.
    toolId:
      name: toolId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID tài nguyên trong không gian làm việc.
    apiConnectionId:
      name: apiConnectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID kết nối API trong không gian làm việc.
    serverId:
      name: serverId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID tài nguyên trong không gian làm việc.
    skillId:
      name: skillId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID tài nguyên trong không gian làm việc.
    deliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID tài nguyên trong không gian làm việc.
  responses:
    ProblemResponse:
      description: Yêu cầu không thành công. Tài nguyên không được phép đọc có thể được xem là không tồn tại.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ProblemCode:
      type: string
      enum:
      - validation_failed
      - unauthenticated
      - forbidden
      - not_found
      - conflict
      - rate_limited
      - provider_not_configured
      - provider_auth_failed
      - provider_unreachable
      - model_not_found
      - tool_failed
      - max_iterations_reached
      - loop_detected
      - run_timeout
      - run_cancelled
      - run_in_progress
      - interrupted
      - context_limit_exceeded
      - idempotency_key_reused
      - not_implemented
      - internal
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
    ResourceReference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - id
      - name
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          $ref: '#/components/schemas/ProblemCode'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        run_id:
          type: string
          format: uuid
        related_agents:
          type: array
          items:
            $ref: '#/components/schemas/ResourceReference'
          description: Các trợ lý đang dùng kết nối, để xử lý lỗi conflict khi xóa.
      required:
      - type
      - title
      - status
      - detail
      - code
      - fields
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
      required:
      - status
    Role:
      type: string
      enum:
      - owner
      - admin
      - member
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          minLength: 1
          maxLength: 200
        role:
          $ref: '#/components/schemas/Role'
        status:
          type: string
          enum:
          - active
          - disabled
        must_change_password:
          type: boolean
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - name
      - role
      - status
      - must_change_password
      - last_login_at
      - created_at
    Member:
      $ref: '#/components/schemas/User'
    Me:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
      required:
      - user
    AuthConfig:
      type: object
      properties:
        signup_allowed:
          type: boolean
      required:
      - signup_allowed
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 1024
          writeOnly: true
      required:
      - name
      - email
      - password
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
      required:
      - email
      - password
      additionalProperties: false
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT chỉ giữ trong bộ nhớ phía client.
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          minimum: 1
          example: 900
        me:
          $ref: '#/components/schemas/Me'
      required:
      - access_token
      - token_type
      - expires_in
      - me
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        new_password:
          type: string
          minLength: 10
          maxLength: 1024
          writeOnly: true
      required:
      - current_password
      - new_password
      additionalProperties: false
    MemberCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          minLength: 1
          maxLength: 200
        role:
          $ref: '#/components/schemas/Role'
      required:
      - email
      - name
      - role
      additionalProperties: false
    MemberCreated:
      type: object
      properties:
        member:
          $ref: '#/components/schemas/Member'
        temporary_password:
          type: string
          description: Chỉ trả một lần khi tạo; không lưu vào cache hoặc log.
      required:
      - member
      - temporary_password
    MemberUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        role:
          $ref: '#/components/schemas/Role'
        status:
          type: string
          enum:
          - active
          - disabled
      additionalProperties: false
      minProperties: 1
    ApiKeyScope:
      type: string
      enum:
      - runs:write
      - runs:read
    ApiKeyCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyScope'
          minItems: 1
          maxItems: 2
          uniqueItems: true
      required:
      - name
      - scopes
      additionalProperties: false
    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        prefix:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyScope'
        created_by:
          type: string
          format: uuid
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - prefix
      - scopes
      - created_by
      - last_used_at
      - revoked_at
      - created_at
    ApiKeyCreated:
      type: object
      properties:
        api_key:
          $ref: '#/components/schemas/ApiKey'
        key:
          type: string
          description: Chỉ trả một lần. Định dạng apk_<prefix8>_<secret43>.
        webhook_secret:
          type: string
          description: Chỉ trả một lần. Định dạng whsec_<base64>; dùng xác minh Standard Webhooks.
      required:
      - api_key
      - key
      - webhook_secret
    ConnectionStatus:
      type: string
      enum:
      - unchecked
      - ok
      - failing
    ProviderCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          type: string
          enum:
          - gemini
          - greennode
          - openai_compatible
        base_url:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: Bắt buộc với openai_compatible; GreenNode dùng endpoint được quản lý sẵn; http/https qua kiểm tra egress, HTTPS ngoài dev.
        default_model:
          type: string
          maxLength: 200
          nullable: true
        api_key:
          type: string
          minLength: 1
          maxLength: 8192
          writeOnly: true
      required:
      - name
      - kind
      - api_key
      additionalProperties: false
      description: openai_compatible bắt buộc base_url không null; GreenNode bắt buộc base_url null hoặc bỏ qua.
    ProviderUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          type: string
          enum:
          - gemini
          - greennode
          - openai_compatible
        base_url:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: Bắt buộc với openai_compatible; GreenNode dùng endpoint được quản lý sẵn; http/https qua kiểm tra egress, HTTPS ngoài dev.
        default_model:
          type: string
          maxLength: 200
          nullable: true
        api_key:
          type: string
          minLength: 1
          maxLength: 8192
          writeOnly: true
          nullable: true
          description: Bỏ qua để giữ; null để xóa; chuỗi không rỗng để thay.
      additionalProperties: false
      minProperties: 1
      description: Sau khi cập nhật, openai_compatible vẫn phải có base_url; GreenNode không nhận base_url tùy chỉnh.
    Provider:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          type: string
          enum:
          - gemini
          - greennode
          - openai_compatible
        base_url:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: Bắt buộc với openai_compatible; GreenNode dùng endpoint được quản lý sẵn; http/https qua kiểm tra egress, HTTPS ngoài dev.
        default_model:
          type: string
          maxLength: 200
          nullable: true
        id:
          type: string
          format: uuid
        api_key_hint:
          type: string
          nullable: true
          maxLength: 4
          description: Bốn ký tự cuối của khóa; khóa dài tối đa bốn ký tự được che hoàn toàn bằng dấu sao. Null khi chưa có khóa.
        status:
          $ref: '#/components/schemas/ConnectionStatus'
        last_error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ProblemCode'
            message:
              type: string
          required:
          - code
          - message
          nullable: true
        last_checked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - name
      - kind
      - base_url
      - default_model
      - id
      - api_key_hint
      - status
      - last_error
      - last_checked_at
      - created_at
      - updated_at
