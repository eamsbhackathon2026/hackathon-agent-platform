        lý + API key. Session có sẵn phải cùng trợ lý và người tạo; admin/owner được xem nhưng không được tiếp tục
        hội thoại của người khác. Metadata tối đa 16 KiB sau serialize. webhook_url không được dùng với JWT vì bí
        mật ký gắn API key. Hội thoại có run queued/running trả 409 run_in_progress và không ghi thêm message.
      not:
        required:
        - session_id
        - session_key
        properties:
          session_id: {}
          session_key: {}
    RunStreamRequest:
      type: object
      properties:
        input:
