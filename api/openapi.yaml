          - forbidden
          - not_found
          - conflict
          - rate_limited
          - provider_not_configured
          - provider_auth_failed
          - provider_unreachable
          - model_not_found
          - tool_failed
          - max_iterations_reached
          - loop_detected
          - run_timeout
          - run_cancelled
          - run_in_progress
          - interrupted
          - context_limit_exceeded
          - idempotency_key_reused
          - not_implemented
          - internal
          - null
          nullable: true
        message:
          type: string
      required:
      - ok
      - code
      - message
    Model:
      type: object
      properties:
        id:
          type: string
        display_name:
          type: string
      required:
      - id
      - display_name
    AgentCreateRequest:
