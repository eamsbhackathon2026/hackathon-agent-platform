        context_window_tokens:
          type: integer
          minimum: 8192
          maximum: 2000000
          default: 32768
          description: Tổng dung lượng token dành cho instructions, tools, hội thoại và câu trả lời. Runtime tự tóm tắt lịch sử khi gần giới hạn này.
        max_iterations:
          type: integer
          minimum: 1
          maximum: 25
          default: 8
        timeout_seconds:
          type: integer
          minimum: 10
          maximum: 600
          default: 120
      required:
      - name
      - provider_id
      - model
      additionalProperties: false
    AgentUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        provider_id:
          type: string
          format: uuid
        model:
          type: string
          minLength: 1
          maxLength: 200
        system_prompt:
          type: string
          maxLength: 100000
        temperature:
          type: number
          minimum: 0
          maximum: 2
          nullable: true
        max_output_tokens:
          type: integer
          minimum: 1
          nullable: true
          description: Giới hạn token đầu ra. Giá trị phải chừa 10% safety margin và ít nhất 1.024 token cho input.
        context_window_tokens:
          type: integer
          minimum: 8192
          maximum: 2000000
          description: Tổng dung lượng token dành cho instructions, tools, hội thoại và câu trả lời.
        max_iterations:
          type: integer
          minimum: 1
          maximum: 25
        timeout_seconds:
          type: integer
          minimum: 10
          maximum: 600
      additionalProperties: false
      minProperties: 1
    Agent:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
          default: ''
        provider_id:
          type: string
          format: uuid
        model:
          type: string
          minLength: 1
          maxLength: 200
        system_prompt:
          type: string
          maxLength: 100000
          default: ''
        temperature:
          type: number
          minimum: 0
          maximum: 2
          nullable: true
        max_output_tokens:
          type: integer
          minimum: 1
          nullable: true
          description: Giới hạn token đầu ra đã lưu; null nghĩa là runtime áp dụng mức tối đa bảo thủ phù hợp với dung lượng hội thoại.
        context_window_tokens:
          type: integer
          minimum: 8192
          maximum: 2000000
          default: 32768
          description: Tổng dung lượng token dành cho instructions, tools, hội thoại và câu trả lời.
        max_iterations:
          type: integer
          minimum: 1
          maximum: 25
          default: 8
        timeout_seconds:
          type: integer
          minimum: 10
          maximum: 600
          default: 120
        id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        ready:
          type: boolean
        readiness_error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ProblemCode'
            message:
              type: string
          required:
