      parameters:
      - $ref: '#/components/parameters/agentId'
  /v1/skills:
    get:
      operationId: ListSkills
      tags:
      - skills
      summary: Liệt kê thư viện skill
      description: 'Liệt kê skill trong workspace. Quyền JWT tối thiểu: member.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillPage'
        default:
          $ref: '#/components/responses/ProblemResponse'
